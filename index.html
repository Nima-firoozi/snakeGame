<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnakeGame</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            width: 100%;
            display: flex;
            background: black;
            align-items: center;
            justify-content: center;
        }

        .wrapper {
            min-width: 400px;
            aspect-ratio: 1/1;
            border: 2px solid white;
            align-content: start;
            justify-self: center;
            display: flex;
            flex-wrap: wrap;

            >div {
                width: 5%;
                height: 5%;
                border: 1px solid rgba(255, 255, 255, 0.57);
            }
        }

        .snake {
            background: greenyellow;
        }
    </style>
</head>

<body>
    <div class="wrapper">
    </div>

    <script>
        const wrapper = document.querySelector('.wrapper');
        const fragment = document.createDocumentFragment();


        beforeStrat()

        function beforeStrat() {
            //build ui of wrapper

            for (let i = 1; i <= 400; i++) {
                const childDiv = document.createElement('div');
                childDiv.setAttribute('data-number', i);
                fragment.appendChild(childDiv);
            }
            wrapper.appendChild(fragment);

            //build ui of wrapper

            //select center div for start snake

            const numbersOfStart = [190, 191, 210, 211];
            const startSelected = Math.floor(Math.random() * numbersOfStart.length);
            console.log(numbersOfStart[startSelected]);
            document.querySelector(`[data-number="${numbersOfStart[startSelected]}"]`).classList.add("snake", "first", "last")

            //select center div for start snake

        }


        let moveSnakeDirect = 0;
        let start = false
        document.querySelector("body").addEventListener("keydown", (e) => {

            moveSnakeDirect = e.keyCode;
            start ? null : startGame()
            start = true
        })




        function startGame() {

            !moveSnakeDirect ? null :
                setInterval(() => {

                    console.log(moveSnakeDirect);
                    switch (moveSnakeDirect) {
                        case 37:

                            break;
                        case 38:

                            break;
                        case 39:
                            let numberOfFirst = document.querySelector(".first").dataset.number
                            document.querySelector(".first").classList.remove("first")
                            document.querySelector(`[data-number="${+numberOfFirst + 1}"]`).classList.add("first", "snake")
                            document.querySelector(".last").classList.remove("snake")

                            break;
                        case 40:

                            break;
                    }
                }, 500);
        }



    </script>

</body>

</html>
