<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnakeGame</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            width: 100%;
            display: flex;
            background: black;
            align-items: center;
            justify-content: center;
        }

        .wrapper {
            min-width: 400px;
            aspect-ratio: 1/1;
            border: 2px solid white;
            align-content: start;
            justify-self: center;
            display: flex;
            flex-wrap: wrap;

            >div {
                width: 5%;
                height: 5%;
                border: 1px solid rgba(255, 255, 255, 0.57);
            }
        }

        .snake {
            background: greenyellow;
        }

        .food {
            background: red;
        }
    </style>
</head>

<body>
    <div class="wrapper">
    </div>

    <script>
        const wrapper = document.querySelector('.wrapper');
        const fragment = document.createDocumentFragment();


        beforeStrat()

        function beforeStrat() {
            //build ui of wrapper

            for (let i = 1; i <= 400; i++) {
                const childDiv = document.createElement('div');
                childDiv.classList.add("empty")
                childDiv.setAttribute('data-number', i);
                fragment.appendChild(childDiv);
            }
            wrapper.appendChild(fragment);

            //build ui of wrapper

            //select center div for start snake

            const numbersOfStart = [190, 191, 210, 211];
            const startSelected = Math.floor(Math.random() * numbersOfStart.length);
            document.querySelector(`[data-number="${numbersOfStart[startSelected]}"]`).classList.add("snake", "first", "last")
            document.querySelector(`[data-number="${numbersOfStart[startSelected]}"]`).classList.remove("empty")

            //select center div for start snake

        }


        let moveSnakeDirect = 0
        let start = false
        let changeDirect = false
        document.querySelector("body").addEventListener("keydown", (e) => {

            e.keyCode == moveSnakeDirect ? changeDirect = false : changeDirect = true
            moveSnakeDirect = e.keyCode;
            start ? null : startGame()
            start = true

        })

        function createFood() {
            let emptyBlock = document.querySelectorAll(".empty")
            let numberRandomEmptyBlock = Math.floor(Math.random() * emptyBlock.length);
            emptyBlock[numberRandomEmptyBlock].classList.add("food")
            emptyBlock[numberRandomEmptyBlock].classList.remove("empty")

        }
        createFood()
        function moveTo(direct, numberOfDirect) {
            let firstOfSnake = document.querySelector(".first")
            let numberOfFirst = firstOfSnake.dataset.number
            let nextOfSnake = document.querySelector(`[data-number="${+numberOfFirst + +numberOfDirect}"]`)
            let lastOfSnake = document.querySelector(".last")
            let numberOfLast = lastOfSnake.dataset.number
            firstOfSnake.classList.add(direct)
            if (nextOfSnake.classList.contains("food")) {
                nextOfSnake.classList.remove("food")
                firstOfSnake.classList.remove("first")
                nextOfSnake.classList.add("first", "snake")
                createFood()
                return;
            }
            if (nextOfSnake.classList.contains("snake")) {
                alert("game over")
                return;
            }
            firstOfSnake.classList.remove("first")
            nextOfSnake.classList.add("first", "snake")
            nextOfSnake.classList.remove("empty")
            lastOfSnake.classList.remove("snake", "last")
            switch (lastOfSnake.className) {
                case "right":
                    document.querySelector(`[data-number="${+numberOfLast + +1}"]`).classList.add("last")
                    lastOfSnake.className = 'empty'
                    break;
                case "up":
                    document.querySelector(`[data-number="${+numberOfLast + -20}"]`).classList.add("last")
                    lastOfSnake.className = 'empty'
                    break;
                case "left":
                    document.querySelector(`[data-number="${+numberOfLast + -1}"]`).classList.add("last")
                    lastOfSnake.className = 'empty'
                    break;
                case "down":
                    document.querySelector(`[data-number="${+numberOfLast + +20}"]`).classList.add("last")
                    lastOfSnake.className = 'empty'
                    break;
            }
        }


        function startGame() {
            !moveSnakeDirect ? null :
                setInterval(() => {
                    switch (moveSnakeDirect) {
                        case 37:
                            moveTo("left", -1)
                            break;
                        case 38:
                            moveTo("up", -20)
                            break;
                        case 39:
                            moveTo("right", 1)

                            break;
                        case 40:
                            moveTo("down", 20)
                            break;
                    }
                }, 500);
        }



    </script>

</body>

</html>
