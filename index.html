<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnakeGame</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            width: 100%;
            display: flex;
            background: black;
            justify-content: center;
            flex-wrap: wrap;
            align-content: center;
        }

        h1 {
            color: aliceblue;
            width: 100%;
            text-align: center;
        }

        .wrapper {
            width: 400px;
            aspect-ratio: 1/1;
            border: 2px solid white;

            display: flex;
            flex-wrap: wrap;
            align-content: center;
            justify-content: center;

            >div {
                width: 5%;
                height: 5%;
                border: 1px solid rgba(255, 255, 255, 0.57);

            }

            >h2 {
                color: aliceblue;
                text-align: center;
                margin-bottom: 10px;
                width: 100%;
                font-size: 40px;
            }

            >.gameover {
                width: 100%;
                display: flex;
                justify-content: center;
                padding: 10px;
                gap: 10px;
                height: auto;
                border: none;

                >button {
                    font-size: 25px;
                    padding: 5px;
                    cursor: pointer;
                    color: aliceblue;
                    background: #000;
                    border: 2px solid white;
                    border-radius: 10px;
                }

            }
        }



        .snake {
            background: greenyellow;
        }

        .food {
            background: red;
        }

        .first {
            background-color: green;
        }
    </style>
</head>

<body>
    <h1>Snake Game</h1>
    <div class="wrapper">

    </div>

    <script>
        const wrapper = document.querySelector('.wrapper');
        const fragment = document.createDocumentFragment();
        let nextSnakeNumber = 191;


        beforeStrat()

        function beforeStrat() {

            // clear wrapper

            wrapper.innerHTML = ''


            // clear wrapper

            //build ui of wrapper

            for (let i = 1; i <= 400; i++) {
                const childDiv = document.createElement('div');
                childDiv.classList.add("empty")
                childDiv.setAttribute('data-number', i);
                fragment.appendChild(childDiv);
            }
            wrapper.appendChild(fragment);

            //build ui of wrapper

            //select center div for start snake


            const numbersOfStart = [190, 191, 210, 211];
            const startSelected = Math.floor(Math.random() * numbersOfStart.length);
            document.querySelector(`[data-number="${numbersOfStart[startSelected]}"]`).classList.add("snake", "first", "last")
            document.querySelector(`[data-number="${numbersOfStart[startSelected]}"]`).classList.remove("empty")

            //select center div for start snake

            //select empty block for food

            createFood()

            //select empty block for food

        }


        let moveSnakeDirect = 0
        let start = false
        let changeDirect = false

        function win() {
            wrapper.innerHTML = `<h2>win</h2>`
        }

        document.querySelector("body").addEventListener("keydown", (e) => {
            let snakeLength = document.querySelectorAll(".snake").length
            snakeLength = 400
            snakeLength == 400 ? win() : null

            e.keyCode == moveSnakeDirect ? changeDirect = false : changeDirect = true
            if (snakeLength != 1) {
                if (moveSnakeDirect - 2 == e.keyCode || moveSnakeDirect + 2 == e.keyCode) {
                    return
                }
            }

            moveSnakeDirect = e.keyCode;
            start ? null : startGame()
            start = true

        })

        function gameOver() {
            clearInterval(startSetInterval)
            wrapper.innerHTML = `<h2>Gamo Over</h2>
        <div class="gameover">
            <button class="restart">RESTART</button>
            <button class="exit">EXIT</button>
        </div>`
            document.querySelector(".exit").addEventListener("click", () => {
                window.close()
            })
            document.querySelector(".restart").addEventListener("click", () => {
                start = false
                beforeStrat()
            })


        }

        function createFood() {
            let emptyBlock = document.querySelectorAll(".empty")
            let numberRandomEmptyBlock = Math.floor(Math.random() * emptyBlock.length);
            while (!(emptyBlock[numberRandomEmptyBlock])) {
                console.log(1);
                numberRandomEmptyBlock = Math.floor(Math.random() * emptyBlock.length);
            }
            emptyBlock[numberRandomEmptyBlock].classList.add("food")
            emptyBlock[numberRandomEmptyBlock].classList.remove("empty")

        }


        function moveTo(direct, numberOfDirect) {
            let firstOfSnake = document.querySelector(".first")
            let numberOfFirst = firstOfSnake.dataset.number
            nextSnakeNumber = +numberOfFirst + +numberOfDirect
            if (nextSnakeNumber > 400 || nextSnakeNumber < 1) {
                gameOver()
            }
            let nextOfSnake = document.querySelector(`[data-number="${+nextSnakeNumber}"]`)
            let lastOfSnake = document.querySelector(".last")
            let numberOfLast = lastOfSnake.dataset.number
            firstOfSnake.classList.add(direct)
            if (nextOfSnake.classList.contains("food")) {
                nextOfSnake.classList.remove("food")
                firstOfSnake.classList.remove("first")
                nextOfSnake.classList.add("first", "snake")
                createFood()
                return;
            }
            if (nextOfSnake.classList.contains("snake")) {
                gameOver()
                return;
            }
            firstOfSnake.classList.remove("first")
            nextOfSnake.classList.add("first", "snake")
            nextOfSnake.classList.remove("empty")
            lastOfSnake.classList.remove("snake", "last")
            switch (lastOfSnake.className) {
                case "right":
                    document.querySelector(`[data-number="${+numberOfLast + +1}"]`).classList.add("last")
                    lastOfSnake.className = 'empty'
                    break;
                case "up":
                    document.querySelector(`[data-number="${+numberOfLast + -20}"]`).classList.add("last")
                    lastOfSnake.className = 'empty'
                    break;
                case "left":
                    document.querySelector(`[data-number="${+numberOfLast + -1}"]`).classList.add("last")
                    lastOfSnake.className = 'empty'
                    break;
                case "down":
                    document.querySelector(`[data-number="${+numberOfLast + +20}"]`).classList.add("last")
                    lastOfSnake.className = 'empty'
                    break;
            }
        }

        let startSetInterval

        function startGame() {
            !moveSnakeDirect ? null :
                startSetInterval = setInterval(() => {
                    switch (moveSnakeDirect) {
                        case 37:
                            (nextSnakeNumber % 20) == 1 ? gameOver() : moveTo("left", -1)
                            break;
                        case 38:
                            moveTo("up", -20)
                            break;
                        case 39:
                            (nextSnakeNumber % 20) ? moveTo("right", 1) : gameOver()
                            break;
                        case 40:
                            moveTo("down", 20)
                            break;
                    }
                }, 500);
        }



    </script>

</body>

</html>
